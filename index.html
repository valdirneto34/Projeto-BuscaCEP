<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/favicon/favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>BuscaCEP | Consulta de Endereços</title>
</head>

<body>
    <div class="tema-toggle">
        <input type="checkbox" id="chk-tema" class="checkbox-tema" onchange="alternarTema()">
        <label for="chk-tema" class="label-tema">
            <span class="icone-tema">☀️</span>
            <span class="icone-tema">🌙</span>
            <span class="bola"></span>
        </label>
    </div>

    <div class="principal">
        <h1>Consulta de Endereço por CEP</h1>
        <div class="form-group">
            <label for="cep">CEP:</label>
            <div class="input-busca">
                <input type="text" name="cep" id="cep" maxlength="10" placeholder="00.000-000" oninput="mascaraCep(this)">
                <button type="button" id="btn-buscar" onclick="buscarCep()">Pesquisar</button>
            </div>
        </div>

        <div class="form-group">
            <label for="logradouro">Logradouro:</label>
            <input type="text" name="logradouro" id="logradouro" readonly>
        </div>

        <div class="form-group">
            <label for="complemento">Complemento:</label>
            <input type="text" name="complemento" id="complemento" readonly>
        </div>

        <div class="form-group">
            <label for="unidade">Unidade:</label>
            <input type="text" name="unidade" id="unidade" readonly>
        </div>

        <div class="form-group">
            <label for="bairro">Bairro:</label>
            <input type="text" name="bairro" id="bairro" readonly>
        </div>

        <div class="form-group">
            <label for="localidade">Localidade (Cidade):</label>
            <input type="text" name="localidade" id="localidade" readonly>
        </div>

        <div class="form-group">
            <label for="uf">UF:</label>
            <input type="text" name="uf" id="uf" readonly>
        </div>

        <div class="form-group">
            <label for="estado">Estado:</label>
            <input type="text" name="estado" id="estado" readonly>
        </div>

        <div class="form-group">
            <label for="regiao">Região:</label>
            <input type="text" name="regiao" id="regiao" readonly>
        </div>

        <div class="form-group">
            <label for="ibge">IBGE:</label>
            <input type="text" name="ibge" id="ibge" readonly>
        </div>

        <div class="form-group">
            <label for="gia">GIA:</label>
            <input type="text" name="gia" id="gia" readonly>
        </div>

        <div class="form-group">
            <label for="ddd">DDD:</label>
            <input type="text" name="ddd" id="ddd" readonly>
        </div>

        <div class="form-group">
            <label for="siafi">SIAFI:</label>
            <input type="text" name="siafi" id="siafi" readonly>
        </div>

    </div>
    <p class="autoria">
        Criado por
        <a target="_blank" href="https://github.com/valdirneto34">Valdir Neto</a>
        &copy; 2026
    </p>
</body>

</html>
